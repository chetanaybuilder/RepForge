<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">RepForge animated banner</title>
  <desc id="desc">A crisp neon RepForge name with training dumbbells</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b14"/>
      <stop offset=".52" stop-color="#111b31"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1=".4" x2="1" y2=".4">
      <stop stop-color="#d8f8ff"/>
      <stop offset=".42" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#00aeef"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#21b7e8" stroke-opacity=".12"/>
    </pattern>
    <style>
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes scan { from{transform:translateX(-180px)} to{transform:translateX(1050px)} }
      .title { animation: float 4s ease-in-out infinite; }
      .scanner { animation: scan 4.8s linear infinite; }
    </style>
  </defs>
  <rect width="920" height="220" rx="18" fill="url(#background)"/>
  <rect width="920" height="220" rx="18" fill="url(#grid)"/>
  <path d="M0 178 C210 140 340 205 520 166 S760 140 920 176V220H0Z" fill="#0b203a" fill-opacity=".66"/>
  <circle cx="820" cy="48" r="62" fill="#00bfff" fill-opacity=".07"/>
  <g class="scanner" opacity=".45">
    <rect x="-130" y="24" width="96" height="170" fill="#8aeaff" fill-opacity=".05"/>
    <rect x="-35" y="24" width="2" height="170" fill="#8aeaff"/>
  </g>

  <g transform="translate(82 110)" fill="none" stroke="#73dcff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-28 0H28" stroke-width="7"/>
    <rect x="-42" y="-18" width="16" height="36" rx="4" stroke-width="6"/>
    <rect x="-58" y="-12" width="12" height="24" rx="3" stroke-width="5"/>
    <rect x="26" y="-18" width="16" height="36" rx="4" stroke-width="6"/>
    <rect x="46" y="-12" width="12" height="24" rx="3" stroke-width="5"/>
  </g>
  <g transform="translate(838 110)" fill="none" stroke="#73dcff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-28 0H28" stroke-width="7"/>
    <rect x="-42" y="-18" width="16" height="36" rx="4" stroke-width="6"/>
    <rect x="-58" y="-12" width="12" height="24" rx="3" stroke-width="5"/>
    <rect x="26" y="-18" width="16" height="36" rx="4" stroke-width="6"/>
    <rect x="46" y="-12" width="12" height="24" rx="3" stroke-width="5"/>
  </g>

  <g class="title" transform="translate(460 112)">
    <text x="5" y="48" text-anchor="middle" font-family="Arial Black,Inter,Segoe UI,sans-serif" font-size="76" font-weight="900" letter-spacing="2" fill="#02070d" opacity=".95">REPFORGE</text>
    <text x="0" y="40" text-anchor="middle" font-family="Arial Black,Inter,Segoe UI,sans-serif" font-size="76" font-weight="900" letter-spacing="2" fill="#071929" stroke="#4edcff" stroke-width="2.2">REPFORGE</text>
    <text x="-4" y="34" text-anchor="middle" font-family="Arial Black,Inter,Segoe UI,sans-serif" font-size="76" font-weight="900" letter-spacing="2" fill="url(#name)" filter="url(#glow)">REPFORGE</text>
  </g>
  <text x="460" y="185" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="4" fill="#9ae8fb">TRAIN SMARTER  /  PROGRESS MEASURED</text>
</svg>
