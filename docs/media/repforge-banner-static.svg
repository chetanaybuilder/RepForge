<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 920 220" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">RepForge banner</title>
  <desc id="desc">Full RepForge wordmark with left and right dumbbells</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b14"/>
      <stop offset=".55" stop-color="#111b31"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="textFill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c8f4ff"/>
      <stop offset=".48" stop-color="#69e2ff"/>
      <stop offset="1" stop-color="#00aeef"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#21b7e8" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="920" height="220" rx="18" fill="url(#bg)"/>
  <rect width="920" height="220" rx="18" fill="url(#grid)"/>
  <path d="M0 178 C210 140 340 205 520 166 S760 140 920 176V220H0Z" fill="#0b203a" fill-opacity=".66"/>
  <g transform="translate(125 110)" fill="none" stroke="#73dcff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#textGlow)">
    <path d="M-30 0H30"/>
    <rect x="-46" y="-18" width="16" height="36" rx="4"/>
    <rect x="-62" y="-12" width="12" height="24" rx="3"/>
    <rect x="30" y="-18" width="16" height="36" rx="4"/>
    <rect x="46" y="-12" width="12" height="24" rx="3"/>
  </g>
  <g transform="translate(795 110)" fill="none" stroke="#73dcff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#textGlow)">
    <path d="M-30 0H30"/>
    <rect x="-46" y="-18" width="16" height="36" rx="4"/>
    <rect x="-62" y="-12" width="12" height="24" rx="3"/>
    <rect x="30" y="-18" width="16" height="36" rx="4"/>
    <rect x="46" y="-12" width="12" height="24" rx="3"/>
  </g>
  <g transform="translate(460 114)">
    <text x="3" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="#020a12" stroke="#020a12" stroke-width="5">REPFORGE</text>
    <text x="0" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="url(#textFill)" stroke="#5edcff" stroke-width="1" filter="url(#textGlow)">REPFORGE</text>
  </g>
  <text x="460" y="185" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" letter-spacing="4" fill="#9ae8fb">TRAIN SMARTER  /  PROGRESS MEASURED</text>
</svg>
