services:
  # ============================================================
  # RepForge (Full Stack Flask + React)
  # ============================================================
  - type: web
    name: repforge
    runtime: python
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k sync -b 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_SECONDS
        value: 25
